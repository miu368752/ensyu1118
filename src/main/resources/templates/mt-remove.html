<!DOCTYPE html>

<title>店舗削除</title>
<link rel="stylesheet" th:href="@{/css/mt-style.css}">
</head>
<body>

	<h2>店舗削除</h2>

    <form th:action="@{/mt-confirm-remove}" method="POST" th:object="${mtRestaurantRemoveForm}">

		<p th:text="*{restaurantId}"></p>
		<input type="hidden" th:field="*{restaurantId}">
		<br>
    	【店舗名】<br>

    	【キャッチフレーズ】<br>
